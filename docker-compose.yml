services:
  control-plane:
    build:
      context: .
      dockerfile: apps/control-plane/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?set a Neon or other Edge-compatible Postgres URL}
      INFNET_ADMIN_TOKEN: ${INFNET_ADMIN_TOKEN:?set INFNET_ADMIN_TOKEN}
      INFNET_ADMIN_OPERATOR_TOKEN: ${INFNET_ADMIN_OPERATOR_TOKEN:?set INFNET_ADMIN_OPERATOR_TOKEN}
      INFNET_ADMIN_VIEWER_TOKEN: ${INFNET_ADMIN_VIEWER_TOKEN:?set INFNET_ADMIN_VIEWER_TOKEN}
      INFNET_NODE_BOOTSTRAP_TOKEN: ${INFNET_NODE_BOOTSTRAP_TOKEN:?set INFNET_NODE_BOOTSTRAP_TOKEN}
      INFNET_PAYMENT_WEBHOOK_SECRET: ${INFNET_PAYMENT_WEBHOOK_SECRET:?set INFNET_PAYMENT_WEBHOOK_SECRET}
      INFNET_PAYMENT_PROVIDER: ${INFNET_PAYMENT_PROVIDER:-webhook}
      INFNET_PUBLIC_URL: ${INFNET_PUBLIC_URL:-http://localhost:3000}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL:?set an Upstash Redis REST URL}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:?set an Upstash Redis REST token}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
